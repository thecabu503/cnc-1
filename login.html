            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
      h = [(temp1 + temp2) | 0].concat(h);
      h[4] = (h[4] + temp1) | 0;
      h.pop();
    }
    for (let i = 0; i < 8; i++) h[i] = (h[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++) {
    for (let j = 3; j + 1; j--) {
      const b = (h[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}


function findPersonAcrossAllTiers(empQuery, roleHint) {
  if (!empQuery) return null;
  const q = String(empQuery).trim().toUpperCase();
  const qPad = /^\d+$/.test(q) ? q.padStart(5, "0") : q;
  const order = roleHint && MASTER_DATA.evaluatees_by_role[roleHint]
    ? [roleHint, "TECH", "LEADER", "ASST", "ENGINEER"]
    : ["TECH", "LEADER", "ASST", "ENGINEER"];
  for (const rg of order) {
    for (const z of ["CNC-1", "CNC-2"]) {
      for (const p of (MASTER_DATA.evaluatees_by_role[rg][z] || [])) {
        const ec = String(p.emp_clean || "").toUpperCase();
        const lg = String(p.login || "").toUpperCase().split(" ")[0];
        if (ec === q || ec === qPad || lg === q) return { roleGroup: rg, zone: z, person: p };
      }
    }
  }
  return null;
}

function buildTargetIndexUrl() {
  const params = new URLSearchParams(window.location.search);
  params.delete("logout");
  const qs = params.toString();
  return "index.html" + (qs ? "?" + qs : "");
}

function initLoginPage() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("logout") === "1") {
    localStorage.removeItem(LS_AUTH_SESSION);
  } else {
    try {
      const existing = JSON.parse(localStorage.getItem(LS_AUTH_SESSION) || "null");
      if (existing && existing.id && existing.expires_at > Date.now()) {
        window.location.replace(buildTargetIndexUrl());
        return;
      }
    } catch (e) {}
  }

  // Populate evaluator dropdown grouped by CNC-1 & CNC-2
  const sel = document.getElementById("evalSelect");
  ["CNC-1", "CNC-2"].forEach(z => {
    const og = document.createElement("optgroup");
    og.label = z === "CNC-1"
      ? "🔵 สายการผลิต CNC-1 (Sup: ทักกุยะ, วรินทร / Ass. / Leader)"
      : "🟣 สายการผลิต CNC-2 (Sup: อนุรักษ์ / Ass. / Leader)";
    (MASTER_DATA.all_evaluators || []).filter(e => e.zone === z).forEach(ev => {
      const opt = document.createElement("option");
      opt.value = ev.id;
      opt.textContent = `[${ev.id}] ${ev.name_th} (${ev.role})`;
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });

  // Show QR target preview if arrived via QR scan
  const empParam = params.get("emp") || params.get("tech") || params.get("id");
  const roleParam = (params.get("role") || "").toUpperCase();
  if (empParam) {
    const hit = findPersonAcrossAllTiers(empParam, roleParam);
    if (hit) {
      const box = document.getElementById("qrPreviewBox");
      box.style.display = "block";
      box.innerHTML = `🎯 <strong>ผู้รับการประเมินจาก QR Code:</strong><br>[${hit.zone}] รหัส ${hit.person.emp_clean} — ${hit.person.name_th}`;
    }
  }

  document.getElementById("pinInput").focus();
}

function togglePinVisibility() {
  const inp = document.getElementById("pinInput");
  inp.type = inp.type === "password" ? "text" : "password";
}

function showError(msg) {
  const box = document.getElementById("errBox");
  box.textContent = msg;
  box.style.display = "block";
}

async function onSubmitLogin(ev) {
  ev.preventDefault();
  document.getElementById("errBox").style.display = "none";

  const selectedId = document.getElementById("evalSelect").value.trim();
  const pin = document.getElementById("pinInput").value.trim();

  if (!/^\d{6}$/.test(pin)) {
    showError("⚠️ กรุณากรอกรหัสผ่านผู้ประเมินให้ครบ 6 หลัก (ตัวเลข 0-9)");
    return;
  }

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "⏳ กำลังตรวจสอบรหัสผ่าน...";

  let matchedEv = null;
  let checkedByCloud = false;

  // 1) ตรวจสอบกับชีต 4_Evaluator_Passwords บน Google Sheet ก่อน (รองรับกรณีผู้ดูแลแก้ไขรหัสผ่านเองในชีต)
  if (DEFAULT_GAS_WEBAPP_URL) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6500);
      const resp = await fetch(DEFAULT_GAS_WEBAPP_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "verify_login",
          evaluator_id: selectedId,
          password: pin
        }),
        signal: ctrl.signal
      });
      clearTimeout(timer);
      const resJson = await resp.json();
      if (resJson && resJson.auth_mode === "sheet") {
        checkedByCloud = true;
        if (resJson.valid && resJson.evaluator) {
          const localRef = (MASTER_DATA.all_evaluators || []).find(x => x.id === resJson.evaluator.id);
          matchedEv = localRef || resJson.evaluator;
        }
      }
    } catch (netErr) {
      // หากอินเทอร์เน็ตช้าหรือยังไม่ได้อัปเดต Code.gs รุ่นใหม่ จะสลับไปตรวจด้วย SHA-256 อัตโนมัติ
    }
  }

  // 2) Fallback ตรวจสอบด้วย Salted SHA-256 Hash (ไม่มีการเก็บรหัสจริงแบบ Plain-text ในหน้าเว็บ)
  if (!checkedByCloud) {
    const salt = MASTER_DATA.auth_salt || "";
    if (selectedId) {
      const targetHash = sha256Hex(`ID:${selectedId}:${pin}:${salt}`);
      matchedEv = (MASTER_DATA.all_evaluators || []).find(x => x.id === selectedId && x.id_pin_sha256 === targetHash) || null;
    } else {
      const pinHash = sha256Hex(`PIN:${pin}:${salt}`);
      matchedEv = (MASTER_DATA.all_evaluators || []).find(x => x.pin_sha256 === pinHash) || null;
    }
  }

  btn.disabled = false;
  btn.textContent = "🔓 เข้าสู่ระบบประเมินผล";

  if (!matchedEv) {
    showError(selectedId
      ? "❌ รหัสผ่าน 6 หลักไม่ตรงกับชื่อผู้ประเมินที่เลือก กรุณาตรวจสอบอีกครั้ง"
      : "❌ รหัสผ่าน 6 หลักไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง");
    document.getElementById("pinInput").select();
    return;
  }

  const sessionObj = {
    id: matchedEv.id,
    login: matchedEv.login,
    name_th: matchedEv.name_th,
    name_en: matchedEv.name_en || "",
    role: matchedEv.role,
    zone: matchedEv.zone,
    allowed_roles: matchedEv.allowed_roles || ["TECH"],
    login_at: Date.now(),
    expires_at: Date.now() + SESSION_TTL_MS
  };
  localStorage.setItem(LS_AUTH_SESSION, JSON.stringify(sessionObj));
  window.location.replace(buildTargetIndexUrl());
}

window.addEventListener("DOMContentLoaded", initLoginPage);
</script>
